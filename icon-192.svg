<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b0"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.55"/>
  <!-- Graphic telemetry ring -->
  <circle cx="96" cy="84" r="46" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="96" cy="84" r="46" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="210 290" stroke-linecap="round" transform="rotate(-125 96 84)"/>
  <!-- Monogram SB -->
  <text x="96" y="96" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="38" fill="#f8fafc" letter-spacing="1">SB</text>
  <!-- Label SAMU BET -->
  <text x="96" y="158" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="20" fill="#00e5b0" letter-spacing="2.5">SAMU BET</text>
</svg>

